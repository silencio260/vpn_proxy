name: vpn_proxy
description: "VPN Proxy - Secure & Fast VPN powered by OpenVPN"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Dependency injection
  get_it: ^9.2.0

  # Functional programming (Either)
  dartz: ^0.10.1

  # Networking
  dio: ^5.9.0
  http: ^1.3.0
  internet_connection_checker: ^1.0.0+1

  # CSV parsing (for vpngate.net)
  csv: ^6.0.0

  # Local storage
  shared_preferences: ^2.5.4

  # Proxy engine (Xray-core Android VpnService; dials vless/vmess/trojan/ss
  # share links from the Firestore proxy list).
  #
  # NOTE: openvpn_flutter was removed — it and flutter_v2ray are both built with
  # Go's gomobile, which emits its native library under the fixed name
  # `libgojni.so`. Two such plugins cannot coexist in one APK (duplicate
  # `lib/<abi>/libgojni.so` at merge time). The app is proxy-only, so the Xray
  # engine wins and the OpenVPN engine is now a pure-Dart stub
  # (features/vpn/services/vpn_engine_service.dart).
  flutter_v2ray: ^1.0.4

  # Installed-app listing (Android) for the split-tunneling excluded-apps
  # picker. Requires QUERY_ALL_PACKAGES in the manifest on Android 11+.
  installed_apps: ^1.6.0

  # UI
  lottie: ^3.3.1

  # GenRevibes internal plugin (Analytics, Ads, IAP, Onboarding, Settings,
  # Remote Config, etc.). Manages Firebase Analytics/Crashlytics/Remote Config
  # wiring — requires Firebase.initializeApp() in the host app first.
  starter_kit:
    path: packages/genrevibes_starter_kit

  # Firebase — declared as DIRECT deps and version-aligned to the starter kit
  # (packages/genrevibes_starter_kit/pubspec.yaml) so analytics never breaks on
  # a lost transitive edge. Do NOT rely on these leaking in through the kit.
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.0
  firebase_crashlytics: ^4.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/lottie/
    - assets/flags/
